<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustrasi arsitektur aplikasi web dan mobile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08143a"/><stop offset="1" stop-color="#0d2b66"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0062ff"/><stop offset="1" stop-color="#4d9aff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g fill="none" stroke="#1d3f7a" stroke-width="1.5" opacity="0.55">
    <path d="M0 520 H800"/><path d="M0 440 H800"/><path d="M0 360 H800"/>
    <path d="M0 280 H800"/><path d="M0 200 H800"/><path d="M0 120 H800"/>
    <path d="M100 0 V600"/><path d="M250 0 V600"/><path d="M400 0 V600"/><path d="M550 0 V600"/><path d="M700 0 V600"/>
  </g>
  <!-- jendela browser (web app) -->
  <g>
    <rect x="90" y="120" width="330" height="230" rx="14" fill="#0a1b47" stroke="#2a56a8" stroke-width="2"/>
    <rect x="90" y="120" width="330" height="38" rx="14" fill="#0d2354"/>
    <circle cx="114" cy="139" r="6" fill="#ff5f57"/><circle cx="134" cy="139" r="6" fill="#febc2e"/><circle cx="154" cy="139" r="6" fill="#28c840"/>
    <rect x="175" y="130" width="225" height="18" rx="9" fill="#132c62"/>
    <rect x="110" y="175" width="140" height="14" rx="7" fill="#4d9aff" opacity="0.9"/>
    <rect x="110" y="200" width="290" height="8" rx="4" fill="#22406f"/>
    <rect x="110" y="216" width="250" height="8" rx="4" fill="#22406f"/>
    <rect x="110" y="240" width="90" height="90" rx="10" fill="url(#acc)"/>
    <rect x="212" y="240" width="90" height="90" rx="10" fill="#1d3f7a"/>
    <rect x="314" y="240" width="90" height="90" rx="10" fill="#1d3f7a"/>
  </g>
  <!-- mobile app -->
  <g>
    <rect x="470" y="90" width="150" height="290" rx="24" fill="#0a1b47" stroke="#2a56a8" stroke-width="2"/>
    <rect x="520" y="104" width="50" height="10" rx="5" fill="#0d2354"/>
    <rect x="486" y="130" width="118" height="56" rx="10" fill="url(#acc)"/>
    <rect x="486" y="196" width="56" height="56" rx="10" fill="#1d3f7a"/>
    <rect x="548" y="196" width="56" height="56" rx="10" fill="#1d3f7a"/>
    <rect x="486" y="262" width="118" height="12" rx="6" fill="#22406f"/>
    <rect x="486" y="282" width="94" height="12" rx="6" fill="#22406f"/>
    <rect x="486" y="310" width="118" height="44" rx="12" fill="#0062ff"/>
    <rect x="505" y="362" width="80" height="6" rx="3" fill="#2a56a8"/>
  </g>
  <!-- API / koneksi -->
  <g stroke="#4d9aff" stroke-width="3" fill="none" stroke-dasharray="10 8">
    <path d="M420 300 C 450 300, 445 235, 470 235"/>
    <path d="M420 300 C 450 300, 445 360, 470 360"/>
  </g>
  <rect x="395" y="282" width="52" height="36" rx="10" fill="url(#acc)"/>
  <text x="421" y="306" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">API</text>
  <!-- label -->
  <rect x="90" y="420" width="270" height="46" rx="12" fill="#0d2354" stroke="#2a56a8"/>
  <text x="104" y="449" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#dce8ff">Web Application</text>
  <rect x="470" y="420" width="150" height="46" rx="12" fill="#0d2354" stroke="#2a56a8"/>
  <text x="500" y="449" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#dce8ff">Mobile App</text>
  <text x="400" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#8fb7ff">Custom Web &amp; Mobile App</text>
  <text x="400" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5f86c9">Arsitektur terintegrasi via REST API</text>
</svg>
